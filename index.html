<style>
  :root{
    --paper:#F6F4EF; --paper-2:#EFEBE2; --ink:#24302B; --ink-soft:#5B675F;
    --teal:#3D6B63; --teal-deep:#2A4B45; --clay:#C1573B; --amber:#C98A32;
    --line:#DCD6C8; --white:#FFFFFF; --radius:14px;
    --shadow:0 2px 10px rgba(36,48,43,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;color:var(--ink);}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 80px;}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 18px;gap:10px;}
  header.top .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  header.top h1{font-size:1.25rem;margin:0;}
  header.top .sub{font-size:0.78rem;color:var(--ink-soft);margin-top:2px;}
  .logo-img{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--line);}
  .logo-fallback{display:flex;align-items:center;justify-content:center;background:var(--teal);color:#fff;font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;}
  .logo-img.mini{width:30px;height:30px;font-size:.85rem;}

  .nav-main{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .nav-main .nv{padding:10px 14px;font-weight:600;font-size:.9rem;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .nav-main .nv.active{color:var(--teal-deep);border-bottom-color:var(--teal);}

  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{font-family:'Inter',sans-serif;font-weight:600;font-size:0.82rem;padding:8px 14px;border-radius:30px;border:1px solid var(--line);background:var(--white);color:var(--ink-soft);cursor:pointer;transition:all .15s ease;}
  .tab.active{background:var(--teal);color:var(--white);border-color:var(--teal);}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}
  .card.click{cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;}
  .card.click:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(36,48,43,0.10);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .card-title{font-family:'Fraunces',serif;font-size:1.06rem;font-weight:600;margin:0 0 6px;}

  .status-pill{font-size:0.72rem;font-weight:600;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
  .status-pendente{background:#FBF0DE;color:var(--amber);}
  .status-aprovado{background:#E4EEEC;color:var(--teal-deep);}
  .status-ajustes{background:#F7E4DE;color:var(--clay);}
  .status-concluido{background:#EFEBE2;color:var(--ink-soft);}
  .card-preview{font-size:0.86rem;color:var(--ink-soft);margin-top:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .deadline{position:relative;width:44px;height:44px;flex-shrink:0;}
  .deadline svg{transform:rotate(-90deg);}
  .deadline .track{fill:none;stroke:var(--paper-2);stroke-width:4;}

  .empty{text-align:center;padding:44px 20px;color:var(--ink-soft);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{font-family:'Inter',sans-serif;font-weight:600;font-size:0.88rem;padding:11px 18px;border-radius:10px;border:none;cursor:pointer;transition:opacity .12s ease;text-decoration:none;display:inline-block;text-align:center;}
  .btn:hover{opacity:0.88;}
  .btn.disabled{opacity:.45;pointer-events:none;}
  .btn-primary{background:var(--teal);color:var(--white);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-clay{background:var(--clay);color:var(--white);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:none;text-decoration:underline;font-weight:500;}

  .overlay{position:fixed;inset:0;background:rgba(36,48,43,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fade .15s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:var(--paper);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:26px 22px 30px;box-shadow:0 -6px 30px rgba(0,0,0,0.15);}

  .gate p{color:var(--ink-soft);font-size:0.88rem;margin:6px 0 18px;}

  .reminder-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FBF0DE;border:1px solid #EBD9AE;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:0.82rem;color:#7A5A1E;}
  .reminder-bar a{color:var(--teal-deep);font-weight:600;text-decoration:none;white-space:nowrap;}
  .aviso{background:#E9EFEE;border:1px solid #C9D9D5;color:var(--teal-deep);}

  .cliente-bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .cliente-bar select{flex:1;min-width:150px;}
  .link-cliente{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:0.78rem;color:var(--ink-soft);margin-bottom:16px;}
  .link-cliente .link-txt{font-size:0.7rem;background:var(--paper-2);padding:3px 8px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* Calendário */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
  .cal-head h2{margin:0;font-size:1.15rem;text-transform:capitalize;}
  .cal-head .acoes{display:flex;gap:6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:.68rem;text-align:center;color:var(--ink-soft);font-weight:600;padding:4px 0;}
  .cal-dia{aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:10px;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.82rem;color:var(--ink);}

  .cal-dia .n{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:500;}
  .cal-dia.hoje .n{background:var(--teal);color:#fff;font-weight:700;}
  .cal-dia.sel{outline:2px solid var(--teal);outline-offset:0;}
  .pts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
  .pt{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .mais{font-size:.6rem;color:var(--ink-soft);}
  .legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--ink-soft);margin:12px 0 4px;}
  .legenda span{display:inline-flex;align-items:center;gap:5px;}
  .dia-painel{margin-top:16px;}
  .dia-titulo{font-family:'Fraunces',serif;font-weight:600;font-size:1.02rem;margin-bottom:10px;text-transform:capitalize;}
  .dia-item{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .dia-item .t{font-weight:600;font-size:.9rem;}
  .dia-vazio{font-size:.86rem;color:var(--ink-soft);margin-bottom:10px;}

  /* Diário */
  .resumo{white-space:pre-wrap;font-size:.84rem;line-height:1.55;background:var(--paper-2);border-radius:10px;padding:14px;margin:0 0 12px;font-family:'Inter',sans-serif;}
  .entrada{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);}
  .entrada:last-child{border-bottom:none;}
  .entrada .d{font-size:.9rem;line-height:1.4;}
  .entrada .m{font-size:.74rem;color:var(--ink-soft);margin-top:3px;}
  .dias-lista{display:flex;gap:8px;flex-wrap:wrap;}
  .dia-chip{font-size:.76rem;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--white);cursor:pointer;font-weight:600;color:var(--ink-soft);}
  .dia-chip.sel{background:var(--teal);color:#fff;border-color:var(--teal);}
  .dia-chip.ok::after{content:" ✓";}

  .footer-note{text-align:center;font-size:0.74rem;color:var(--ink-soft);margin-top:40px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:30px;font-size:0.84rem;box-shadow:0 4px 16px rgba(0,0,0,0.2);z-index:200;}
  .logo-prev{display:flex;align-items:center;gap:12px;margin-top:6px;}
</style>

<script>
/* ======================================================

/* ---------------- Estado ---------------- */
const params = new URLSearchParams(location.search);
const modoAdmin = params.has("painel") || params.has("admin");
const codigoCliente = params.get("c");
const idParaAbrir = params.get("id");

const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS_SEMANA = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const STATUS_COR = {pendente:"#C98A32", aprovado:"#3D6B63", ajustes:"#C1573B", concluido:"#9AA39D"};

let clientes = [];
let clientesCarregados = false;
let clienteId = null;
let cliente = null;
let itens = [];
let diario = [];
let abaPrincipal = "aprovacao";
let filtroAtual = "pendentes";
let calMes = new Date(); calMes.setDate(1); calMes.setHours(0,0,0,0);
let diaSelecionado = hojeISO();
let dataDiario = hojeISO();
let rascunho = {desc:"", dur:"", link:""};
let temLegado = false;
let idJaAberto = false;
let unsubs = [];
let unsubClientes = null;

const app = document.getElementById("app");
const $ = (s, r)=>(r||document).querySelector(s);
const $$ = (s, r)=>Array.from((r||document).querySelectorAll(s));

/* ---------------- Utilidades ---------------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function isoDe(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function hojeISO(){ return isoDe(new Date()); }
function fmtData(iso){
  if(!iso) return "-";
  const p = iso.split("-");
  return p[2]+"/"+p[1]+"/"+p[0];
}
function rotuloDia(iso){
  const d = new Date(iso+"T00:00:00");
  return DIAS_SEMANA[d.getDay()]+", "+fmtData(iso);
}
function diasRestantes(iso){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const prazo = new Date(iso+"T00:00:00");
  return Math.round((prazo - hoje) / 86400000);
}
function urgenciaCor(dias){
  if(dias <= 2) return "#C1573B";
  if(dias <= 5) return "#C98A32";
  return "#3D6B63";
}
function anelPrazo(iso){
  const dias = diasRestantes(iso);
  const cor = urgenciaCor(dias);
  const total = 14;
  const pct = Math.max(0, Math.min(1, (total + dias) / (total * 2)));
  const r = 18, c = 2*Math.PI*r;
  const offset = c * (1 - pct);
  const label = dias < 0 ? "atr." : dias === 0 ? "hoje" : dias+"d";
  return `<div class="deadline">
    <svg width="44" height="44" viewBox="0 0 44 44">
      <circle class="track" cx="22" cy="22" r="${r}"></circle>
      <circle class="fill" cx="22" cy="22" r="${r}" stroke="${cor}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
    </svg>
    <div class="num">${label}</div>
  </div>`;
}
function statusLabel(s){
  return s==="aprovado" ? "Aprovado" : s==="ajustes" ? "Ajustes pedidos" : s==="concluido" ? "Concluído" : "Pendente";
}
function statusClass(s){
  return "status-"+(["aprovado","ajustes","concluido"].indexOf(s)>=0 ? s : "pendente");
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}
function normalizarWhats(n){
  const d = String(n||"").replace(/\D/g,"");
  if(d.length===10 || d.length===11) return "55"+d;
  return d;
}
function gerarCodigo(){
  const alfabeto = "abcdefghijkmnopqrstuvwxyz23456789";
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b=>alfabeto[b % alfabeto.length]).join("");
}
function baseUrl(){ return location.origin + location.pathname; }
function linkCliente(id, itemId){ return baseUrl()+"?c="+id+(itemId?"&id="+itemId:""); }
function waLink(numero, texto){ return "https://wa.me/"+(numero||"")+"?text="+encodeURIComponent(texto); }
function copiar(texto){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(()=>toast("Link copiado"), ()=>window.prompt("Copie o link:", texto));
  } else { window.prompt("Copie o link:", texto); }
}
function lerLogo(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 192;
        const c = document.createElement("canvas");
        c.width = size; c.height = size;
        const lado = Math.min(img.width, img.height);
        c.getContext("2d").drawImage(img, (img.width-lado)/2, (img.height-lado)/2, lado, lado, 0, 0, size, size);
        resolve(c.toDataURL("image/png"));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function logoHTML(c, mini){
  const cls = "logo-img"+(mini?" mini":"");
  if(c && c.logo) return `<img class="${cls}" src="${escapeHtml(c.logo)}" alt="">`;
  const nome = (c && c.nome) ? c.nome.replace(/^(dra|dr)\.?\s+/i,"").trim() : "S";
  return `<div class="${cls} logo-fallback">${escapeHtml(nome.charAt(0).toUpperCase()||"S")}</div>`;
}
function aplicarMarca(){
  if(modoAdmin){ document.title = "Painel Sirius"; return; }
  if(cliente){
    document.title = cliente.nome+" · Aprovações";
    if(cliente.logo){
      const fav = document.getElementById("fav"), touch = document.getElementById("touch");
      if(fav) fav.href = cliente.logo;
      if(touch) touch.href = cliente.logo;
    }
  }
}
function erroConexao(err){
  app.innerHTML = `<div class="empty"><h3>Não foi possível conectar</h3><p>${escapeHtml(err && err.message ? err.message : "Erro desconhecido")}</p></div>`;
}

/* ---------------- Firestore: referências ---------------- */
function clienteRef(id){ return db.collection("clientes").doc(id || clienteId); }
function conteudosRef(){ return clienteRef().collection("conteudos"); }
function diarioRef(){ return clienteRef().collection("diario"); }

function limparListeners(){ unsubs.forEach(u=>{ try{u();}catch(e){} }); unsubs = []; }
function pararTudo(){
  limparListeners();
  if(unsubClientes){ try{unsubClientes();}catch(e){} unsubClientes = null; }
  clientes = []; clientesCarregados = false; clienteId = null; cliente = null; itens = []; diario = [];
}

function escutarCliente(id){
  limparListeners();
  clienteId = id; itens = []; diario = [];
  unsubs.push(conteudosRef().orderBy("prazo","asc").onSnapshot(snap=>{
    itens = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(abaPrincipal !== "diario") render();
    abrirItemDoLink();
  }, erroConexao));
  if(modoAdmin){
    const corte = isoDe(new Date(Date.now() - 90*86400000));
    unsubs.push(diarioRef().where("data",">=",corte).orderBy("data","desc").onSnapshot(snap=>{
      diario = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(abaPrincipal === "diario") render();
    }, erroConexao));
  }
}

function abrirItemDoLink(){
  if(idJaAberto || !idParaAbrir || modoAdmin) return;
  const alvo = itens.find(i=>i.id===idParaAbrir);
  if(alvo){ idJaAberto = true; abrirModalItem(alvo); }
}

/* ---------------- Login (admin) ---------------- */
function renderLogin(){
  app.innerHTML = `
    <div class="gate">
      <div class="logo-img logo-fallback">S</div>
      <h1>Painel Sirius</h1>
      <p>Acesso da equipe</p>
      <input type="email" id="email" placeholder="E-mail" autocomplete="username">

function iniciarAdmin(){
  if(unsubClientes) unsubClientes();
  unsubClientes = db.collection("clientes").orderBy("nome").onSnapshot(snap=>{
    clientes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    clientesCarregados = true;
    const atual = clientes.find(c=>c.id===clienteId);
    if(atual){
      cliente = atual;
      render();
    } else {
      const salvo = lsGet("clienteAtual");
      const alvo = clientes.find(c=>c.id===salvo) || clientes[0];
      if(alvo){ selecionarCliente(alvo.id); }
      else { limparListeners(); clienteId = null; cliente = null; itens = []; diario = []; render(); }
    }
  }, erroConexao);
  verificarLegado();
}

function selecionarCliente(id){
  cliente = clientes.find(c=>c.id===id) || null;
  lsSet("clienteAtual", id);
  diaSelecionado = hojeISO();
  dataDiario = hojeISO();
  rascunho = {desc:"", dur:"", link:""};
  escutarCliente(id);
  render();
}

async function iniciarCliente(id){
  app.innerHTML = `<div class="empty"><p>Carregando…</p></div>`;
  try{
    const doc = await db.collection("clientes").doc(id).get();
    if(!doc.exists){
      app.innerHTML = `<div class="empty"><h3>Link inválido</h3><p>Peça à Sirius um novo link de acesso.</p></div>`;
      return;
    }
    cliente = {id:doc.id, ...doc.data()};
    aplicarMarca();
    escutarCliente(id);
  }catch(e){ erroConexao(e); }
}

/* ---------------- Aba: Aprovação ---------------- */
function montarAprovacao(el, admin){
  const pendentes = itens.filter(i=>i.status==="pendente");
  const revisados = itens.filter(i=>i.status==="aprovado" || i.status==="ajustes");
  const concluidos = itens.filter(i=>i.status==="concluido");
  const urgentes = admin ? pendentes.filter(i=>diasRestantes(i.prazo) <= 2) : [];

  let filtros, lista;
  if(admin){
    if(["pendentes","revisados","concluidos"].indexOf(filtroAtual) < 0) filtroAtual = "pendentes";
    filtros = [["pendentes","Pendentes",pendentes.length],["revisados","Revisados",revisados.length],["concluidos","Concluídos",concluidos.length]];
    lista = filtroAtual==="pendentes" ? pendentes : filtroAtual==="revisados" ? revisados : concluidos;
  } else {
    if(["pendentes","todos"].indexOf(filtroAtual) < 0) filtroAtual = "pendentes";
    filtros = [["pendentes","Pendentes",pendentes.length],["todos","Todos",itens.length]];
    lista = filtroAtual==="pendentes" ? pendentes : itens;
  }

  el.innerHTML = `
    ${urgentes.map(i=>`
      <div class="reminder-bar">
        <span>⏰ "${escapeHtml(i.titulo)}" vence ${diasRestantes(i.prazo)<0?'(atrasado)':'em '+diasRestantes(i.prazo)+' dia(s)'}</span>
        <a href="${lembreteLink(i)}" target="_blank" rel="noopener">Enviar lembrete →</a>
      </div>`).join("")}
    ${admin ? `<div class="btn-row" style="margin:0 0 14px"><button class="btn btn-primary" id="novo-conteudo">+ Novo conteúdo</button></div>` : ""}
    <div class="tabs">${filtros.map(f=>`<div class="tab ${filtroAtual===f[0]?'active':''}" data-f="${f[0]}">${f[1]} (${f[2]})</div>`).join("")}</div>
    <div id="lista"></div>
    ${admin ? `<div class="footer-note">Cliente: ${escapeHtml(cliente.nome)}</div>` : ""}`;

  $$(".tab[data-f]", el).forEach(t=>t.onclick = ()=>{ filtroAtual = t.dataset.f; render(); });
  if(admin) $("#novo-conteudo").onclick = ()=>abrirFormulario();

  const listaEl = $("#lista", el);
  if(lista.length === 0){
    let msg;
    if(!admin) msg = "Não há conteúdos nesta lista no momento.";
    else msg = filtroAtual==="pendentes" ? "Cadastre um conteúdo acima."
      : filtroAtual==="revisados" ? "Quando o cliente aprovar ou pedir ajuste, aparece aqui."
      : "Conteúdos marcados como concluídos aparecem aqui.";
    listaEl.innerHTML = `<div class="empty"><h3>${admin?"Nada por aqui":"Tudo em dia ✅"}</h3><p>${msg}</p></div>`;
    return;
  }
  listaEl.innerHTML = lista.map(item=>admin ? cardAdminHTML(item) : cardClienteHTML(item)).join("");

  if(admin){
    $$(".editar", listaEl).forEach(b=>b.onclick = ()=>{ abrirFormulario(itens.find(i=>i.id===b.dataset.id)); });
    $$(".concluir", listaEl).forEach(b=>b.onclick = async ()=>{
      await conteudosRef().doc(b.dataset.id).update({status:"concluido", atualizadoEm:Date.now()});
      toast("Marcado como concluído ✅");
    });
    $$(".excluir", listaEl).forEach(b=>b.onclick = async ()=>{
      if(confirm("Excluir este conteúdo?")){
        await conteudosRef().doc(b.dataset.id).delete();
        toast("Excluído");
      }
    });
  } else {
    $$(".card", listaEl).forEach(c=>c.onclick = ()=>{ abrirModalItem(itens.find(i=>i.id===c.dataset.id)); });
  }
}

      ${item.comentario ? `<div class="comment-box"><div class="who">Comentário</div>${escapeHtml(item.comentario)}</div>` : ""}
      ${item.status==="pendente" ? `
        <div class="divider"></div>
        <label>Comentário (opcional ao aprovar, necessário ao pedir ajuste)</label>
        <textarea id="comentarioInput" placeholder="Ex: trocar o termo X por Y; está tecnicamente correto porém..."></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" id="aprovar" style="flex:1">Aprovar</button>
          <button class="btn btn-clay" id="ajustar" style="flex:1">Pedir ajuste</button>
        </div>` : ""}
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  $("#fechar", overlay).onclick = ()=>overlay.remove();

  if(item.status === "pendente"){
    const responder = async (status, comentario)=>{
      try{
        await conteudosRef().doc(item.id).update({status, comentario, atualizadoEm:Date.now()});
        overlay.remove();
        toast(status==="aprovado" ? "Conteúdo aprovado ✅" : "Ajuste solicitado");
      }catch(e){ toast("Não foi possível salvar. Tente novamente."); }
    };
    $("#aprovar", overlay).onclick = ()=>responder("aprovado", $("#comentarioInput", overlay).value.trim());
    $("#ajustar", overlay).onclick = ()=>{
      const c = $("#comentarioInput", overlay).value.trim();
      if(!c){ toast("Escreva o que precisa ser ajustado"); return; }
      responder("ajustes", c);
    };
  }
}

      </div>
      ${c ? `<div class="divider"></div><button class="btn btn-ghost btn-small" id="c-excluir" style="color:var(--clay)">Excluir cliente e todos os dados dele</button>` : ""}
    </div>`;

  const fechar = ()=>overlay.remove();
  $("#c-fechar", overlay).onclick = fechar;
  $("#c-cancelar", overlay).onclick = fechar;

    try{
      logoNovo = await lerLogo(f);
      $("#c-prev", overlay).innerHTML = logoHTML({logo:logoNovo});
    }catch(err){ toast("Não consegui ler essa imagem"); }
  };
  const rem = $("#c-remover-logo", overlay);
  if(rem) rem.onclick = ()=>{ logoNovo = ""; $("#c-prev", overlay).innerHTML = logoHTML({nome:$("#c-nome", overlay).value}); };

    const dados = {nome, whatsapp: normalizarWhats($("#c-whats", overlay).value)};

  const exc = $("#c-excluir", overlay);

      await apagarColecao(clienteRef(c.id).collection("conteudos"));
      await apagarColecao(clienteRef(c.id).collection("diario"));
      await clienteRef(c.id).delete();
      fechar();
      toast("Cliente excluído");
    }catch(e){ toast("Não foi possível excluir."); }
  };
}

async function apagarColecao(ref){
  const snap = await ref.get();
  for(let i=0; i<snap.docs.length; i+=400){
    const batch = db.batch();
    snap.docs.slice(i, i+400).forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }
}

/* ---------------- Importar sistema antigo ---------------- */
async function verificarLegado(){
  try{
    const s = await db.collection("conteudos").limit(1).get();
    temLegado = !s.empty;
  }catch(e){ temLegado = false; }
  if(auth.currentUser) render();
}
async function migrarLuana(){
  if(!confirm(`Importar os conteúdos do sistema antigo para um novo cliente "${LUANA_NOME}"?`)) return;
  try{
    const antigos = await db.collection("conteudos").get();
    const id = gerarCodigo();
    await clienteRef(id).set({nome:LUANA_NOME, whatsapp:LUANA_WHATS, logo:"", criadoEm:Date.now(), migradoDoAntigo:true});
    const batch = db.batch();
    antigos.docs.forEach(d=>batch.set(clienteRef(id).collection("conteudos").doc(d.id), d.data()));
    await batch.commit();
    toast("Importado! Adicione o logo dela em Editar.");
    selecionarCliente(id);
  }catch(e){ toast("Falha ao importar: "+(e && e.message ? e.message : "erro")); }
}

/* ---------------- Aba: Calendário ---------------- */
function montarCalendario(el, admin){
  const ano = calMes.getFullYear(), mes = calMes.getMonth();
  const offset = new Date(ano, mes, 1).getDay();
  const total = new Date(ano, mes+1, 0).getDate();
  const porDia = {};
  itens.forEach(i=>{ if(i.dataPublicacao){ (porDia[i.dataPublicacao] = porDia[i.dataPublicacao] || []).push(i); } });
  const semData = itens.filter(i=>!i.dataPublicacao && i.status!=="concluido").length;
  const hoje = hojeISO();

  let cel = "";
  for(let i=0; i<offset; i++) cel += `<div class="cal-dia vazio"></div>`;
  for(let d=1; d<=total; d++){
    const iso = ano+"-"+String(mes+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const lista = porDia[iso] || [];
    const pts = lista.slice(0,4).map(i=>`<span class="pt" style="background:${STATUS_COR[i.status]||"#999"}"></span>`).join("") + (lista.length>4 ? `<span class="mais">+${lista.length-4}</span>` : "");
    cel += `<button class="cal-dia ${iso===hoje?"hoje":""} ${iso===diaSelecionado?"sel":""}" data-iso="${iso}"><span class="n">${d}</span><span class="pts">${pts}</span></button>`;
  }

  let painel = "";
  if(diaSelecionado){
    const lista = porDia[diaSelecionado] || [];
    painel = `<div class="dia-painel">
      <div class="dia-titulo">${rotuloDia(diaSelecionado)}</div>
      ${lista.length ? lista.map(i=>`
        <div class="dia-item" data-id="${escapeHtml(i.id)}" style="border-left-color:${STATUS_COR[i.status]||"#999"}">
          <div><div class="t">${escapeHtml(i.titulo)}</div><div class="card-meta"><span class="type-tag">${escapeHtml(i.tipo)}</span></div></div>
          <span class="status-pill ${statusClass(i.status)}">${statusLabel(i.status)}</span>
        </div>`).join("") : `<div class="dia-vazio">Nenhum conteúdo agendado neste dia.</div>`}
      ${admin ? `<button class="btn btn-outline btn-small" id="cal-novo">+ Agendar conteúdo neste dia</button>` : ""}
    </div>`;
  }

  el.innerHTML = `
    <div class="cal-head">
      <h2>${MESES[mes]} ${ano}</h2>
      <div class="acoes">
        <button class="btn btn-outline btn-small" id="cal-prev">‹</button>
        <button class="btn btn-outline btn-small" id="cal-hoje">Hoje</button>
        <button class="btn btn-outline btn-small" id="cal-next">›</button>
      </div>
    </div>
    <div class="cal-grid">
      ${["D","S","T","Q","Q","S","S"].map(x=>`<div class="cal-dow">${x}</div>`).join("")}
      ${cel}
    </div>
    <div class="legenda">
      <span><i class="pt" style="background:${STATUS_COR.pendente}"></i>Pendente</span>
      <span><i class="pt" style="background:${STATUS_COR.aprovado}"></i>Aprovado</span>
      <span><i class="pt" style="background:${STATUS_COR.ajustes}"></i>Ajustes</span>
      <span><i class="pt" style="background:${STATUS_COR.concluido}"></i>Concluído</span>
    </div>
    ${admin && semData ? `<div class="dia-vazio" style="margin-top:8px">${semData} conteúdo(s) sem data de publicação não aparecem no calendário. Use Editar para definir a data.</div>` : ""}
    ${painel}`;

  const mudarMes = (delta)=>{ calMes = new Date(calMes.getFullYear(), calMes.getMonth()+delta, 1); diaSelecionado = null; render(); };
  $("#cal-prev", el).onclick = ()=>mudarMes(-1);
  $("#cal-next", el).onclick = ()=>mudarMes(1);
  $("#cal-hoje", el).onclick = ()=>{ const h = new Date(); calMes = new Date(h.getFullYear(), h.getMonth(), 1); diaSelecionado = hojeISO(); render(); };
  $$(".cal-dia[data-iso]", el).forEach(b=>b.onclick = ()=>{ diaSelecionado = b.dataset.iso; render(); });
  $$(".dia-item", el).forEach(r=>r.onclick = ()=>{
    const item = itens.find(i=>i.id===r.dataset.id);
    if(!item) return;
    if(admin) abrirFormulario(item); else abrirModalItem(item);
  });
  const novo = $("#cal-novo", el);
  if(novo) novo.onclick = ()=>abrirFormulario(null, diaSelecionado);
}

/* ---------------- Aba: Diário ---------------- */
function resumoDoDia(dataISO){
  const entradas = diario.filter(d=>d.data===dataISO).sort((a,b)=>(a.criadoEm||0)-(b.criadoEm||0));
  const linhas = entradas.map(e=>"✅ "+e.descricao+(e.duracao ? " ("+e.duracao+")" : "")+(e.link ? "\n    🔗 "+e.link : ""));
  return `Olá, ${cliente.nome}! 👋\n\n*Resumo do dia ${fmtData(dataISO)}*\n\n${linhas.join("\n")}\n\nQualquer dúvida, é só me chamar!\n— ${ASSINATURA}`;
}

function montarDiario(el){
  const doDia = diario.filter(d=>d.data===dataDiario).sort((a,b)=>(a.criadoEm||0)-(b.criadoEm||0));
  const todosEnviados = doDia.length > 0 && doDia.every(d=>d.enviadoEm);
  const dias = {};
  diario.forEach(d=>{
    if(!dias[d.data]) dias[d.data] = {total:0, enviados:0};
    dias[d.data].total++;
    if(d.enviadoEm) dias[d.data].enviados++;
  });
  const listaDias = Object.keys(dias).sort().reverse().slice(0, 14);
  const resumo = doDia.length ? resumoDoDia(dataDiario) : "";
  const waHref = doDia.length ? waLink(cliente.whatsapp, resumo) : "#";

  el.innerHTML = `
    <div class="card">
      <label style="margin-top:0">Dia</label>
      <input type="date" id="d-data" value="${escapeHtml(dataDiario)}">
      <label>O que foi feito</label>
      <input type="text" id="d-desc" value="${escapeHtml(rascunho.desc)}" placeholder="Ex: Edição do reels sobre vacinas">
      <div class="grid2">
        <div><label>Tempo (opcional)</label><input type="text" id="d-dur" value="${escapeHtml(rascunho.dur)}" placeholder="Ex: 2h"></div>
        <div><label>Link (opcional)</label><input type="url" id="d-link" value="${escapeHtml(rascunho.link)}" placeholder="https://..."></div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="d-add">+ Registrar</button></div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 6px;font-size:1rem;">${rotuloDia(dataDiario)}</h3>
      ${doDia.length ? doDia.map(e=>`
        <div class="entrada">
          <div><div class="d">${escapeHtml(e.descricao)}</div>
          <div class="m">${[e.duracao, e.link, e.enviadoEm ? "enviado ✓" : ""].filter(Boolean).map(escapeHtml).join(" · ")}</div></div>
          <button class="btn btn-ghost btn-small d-del" data-id="${escapeHtml(e.id)}">Excluir</button>
        </div>`).join("") : `<div class="dia-vazio" style="margin:6px 0 0">Nada registrado neste dia ainda.</div>`}
    </div>

    ${doDia.length ? `
      <div class="card">
        <h3 style="margin:0 0 10px;font-size:1rem;">Mensagem para ${escapeHtml(cliente.nome)}</h3>
        <pre class="resumo">${escapeHtml(resumo)}</pre>
        <a class="btn btn-primary btn-block" id="d-enviar" target="_blank" rel="noopener" href="${waHref}">${todosEnviados ? "Reenviar resumo no WhatsApp" : "Enviar resumo no WhatsApp"}</a>
      </div>` : ""}

    ${listaDias.length ? `
      <div class="card">
        <h3 style="margin:0 0 10px;font-size:1rem;">Últimos dias registrados</h3>
        <div class="dias-lista">${listaDias.map(d=>`<div class="dia-chip ${d===dataDiario?"sel":""} ${dias[d].enviados===dias[d].total?"ok":""}" data-d="${d}">${fmtData(d).slice(0,5)} · ${dias[d].total}</div>`).join("")}</div>
      </div>` : ""}`;

  $("#d-desc", el).oninput = (e)=>{ rascunho.desc = e.target.value; };
  $("#d-dur", el).oninput = (e)=>{ rascunho.dur = e.target.value; };
  $("#d-link", el).oninput = (e)=>{ rascunho.link = e.target.value; };
  $("#d-data", el).onchange = (e)=>{ if(e.target.value){ dataDiario = e.target.value; render(); } };

  const adicionar = async ()=>{
    const descricao = rascunho.desc.trim();
    if(!descricao){ toast("Descreva o que foi feito"); return; }
    try{
      await diarioRef().add({data:dataDiario, descricao, duracao:rascunho.dur.trim(), link:rascunho.link.trim(), criadoEm:Date.now()});
      rascunho = {desc:"", dur:"", link:""};
      toast("Registrado");
    }catch(e){ toast("Não foi possível registrar. Tente novamente."); }
  };
  $("#d-add", el).onclick = adicionar;
  $("#d-desc", el).onkeydown = (e)=>{ if(e.key==="Enter") adicionar(); };

  $$(".d-del", el).forEach(b=>b.onclick = async ()=>{ await diarioRef().doc(b.dataset.id).delete(); });
  $$(".dia-chip", el).forEach(c=>c.onclick = ()=>{ dataDiario = c.dataset.d; render(); });

  const env = $("#d-enviar", el);
  if(env) env.onclick = ()=>{
    const batch = db.batch();
    doDia.forEach(e=>batch.update(diarioRef().doc(e.id), {enviadoEm:Date.now()}));
    batch.commit().catch(()=>{});
  };
}

if(modoAdmin){
  auth.onAuthStateChanged(user=>{
    if(!user){ pararTudo(); renderLogin(); return; }
    iniciarAdmin();
  });
} else if(codigoCliente){
  iniciarCliente(codigoCliente);
} else {
  renderHome();
}
</script>
